[project]
name = "sensinact-docs"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alabaster>=0.7.13",
    "babel>=2.12.1",
    "beautifulsoup4>=4.12.2",
    "certifi>=2023.7.22",
    "charset-normalizer>=3.2.0",
    "colorama>=0.4.6",
    "csvlexer",
    "docutils>=0.20.1",
    "idna>=3.4",
    "imagesize>=1.4.1",
    "jinja2>=3.1.2",
    "markdown-it-py>=3.0.0",
    "markupsafe>=2.1.3",
    "mdit-py-plugins>=0.4.0",
    "mdurl>=0.1.2",
    "myst-parser>=2.0.0",
    "packaging>=23.1",
    "piccolo-theme>=0.17.0",
    "pygments>=2.16.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "snowballstemmer>=2.2.0",
    "soupsieve>=2.4.1",
    "sphinx>=7.2.5",
    "sphinx-basic-ng>=1.0.0b2",
    "sphinxcontrib-applehelp>=1.0.7",
    "sphinxcontrib-devhelp>=1.0.5",
    "sphinxcontrib-htmlhelp>=2.0.4",
    "sphinxcontrib-jsmath>=1.0.1",
    "sphinxcontrib-qthelp>=1.0.6",
    "sphinxcontrib-serializinghtml>=1.1.9",
    "sphinxcontrib-svg2pdfconverter>=2.0.0",
    "urllib3>=2.0.4",
]

[tool.uv.sources]
csvlexer = { git = "https://github.com/Kristinita/PygmentsCSVLexer.git", rev = "e3994efbf2058cd3f141edc869b37b84530eb61c" }
